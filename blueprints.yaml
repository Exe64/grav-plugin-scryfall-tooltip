name: Scryfall Tooltip
slug: scryfall-tooltip
type: plugin
version: 2.0.3
description: |
  Magic: The Gathering card names that show the card image from Scryfall on hover, keyboard focus or tap.

  ```
  [scryfall]Foudre[/scryfall]
  [scryfall]Lightning Bolt[/scryfall]
  [scryfall="Lightning Bolt"]deux Foudres[/scryfall]
  [scryfall set=m10]Foudre[/scryfall]
  [scryfall set=m10 number=146 lang=fr]Foudre[/scryfall]
  ```
icon: image
author:
  name: Julien Dumur
  url: https://github.com/Exe64
license: MIT
homepage: https://github.com/Exe64/grav-plugin-scryfall-tooltip
demo: https://magicthegathering.fr
docs: https://github.com/Exe64/grav-plugin-scryfall-tooltip/blob/main/README.md
bugs: https://github.com/Exe64/grav-plugin-scryfall-tooltip/issues
keywords: [magic, mtg, scryfall, shortcode, tooltip, card]
compatibility:
  grav: ['2.0']
dependencies:
  - { name: grav, version: '>=2.2.0' }
  - { name: shortcode-core, version: '>=5.0.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
